name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-transformer
    steps:
      - uses: actions/checkout@v5

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilation et tests (PostgreSQL lancé par Testcontainers)
        run: ./mvnw -B verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Résumé des erreurs
        if: failure()
        run: |
          grep -nE 'ERROR|Caused by|FAIL' build.log | head -40 | cut -c1-300 | sed 's/%/pct/g; s/::/:/g' | tr '\n' '|' > errs.txt
          echo "::error::$(cat errs.txt)"

      - name: Nombre de tests exécutés
        if: always()
        run: grep -E 'Tests run:' build.log | tail -1 | while IFS= read -r l; do echo "::notice::$l"; done

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-transformer-frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: data-transformer-frontend/package-lock.json

      - run: npm ci

      - name: Build de production
        run: npx ng build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Tests (Vitest)
        run: npx ng test --watch=false 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Résumé
        if: always()
        run: |
          grep -hE 'Tests .*passed|failed|ERROR|✖' build.log test.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | head -15 | while IFS= read -r l; do echo "::notice::$l"; done
