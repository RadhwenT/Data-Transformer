spring.application.name=data-transformer

# Connexion PostgreSQL (conteneur Docker lance a l'etape 4)
# Le mot de passe peut etre surcharge par la variable d'env DB_PASSWORD
# (voir .env.example) ; la valeur par defaut reprend celle de docker-compose.yml
# pour que ca marche out-of-the-box en dev local.
spring.datasource.url=jdbc:postgresql://localhost:5432/data_transformer
spring.datasource.username=datatransformer_user
spring.datasource.password=${DB_PASSWORD:datatransformer_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

spring.jpa.open-in-view=false

# Dossier de stockage des fichiers (entree et sortie)
app.storage.dir=./storage

# Taille max d'un fichier uploade (le defaut du conteneur embarque, non
# configure explicitement, rejetait deja tout au-dela de quelques Mo avec une
# reponse 413 brute sans passer par GlobalExceptionHandler)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Garde-fous du preview (dry-run) : au-dela, 400 sur la taille, troncature
# silencieuse sur le nombre d'enregistrements lus (voir PreviewService)
app.preview.max-file-size=1048576
app.preview.max-records=200

