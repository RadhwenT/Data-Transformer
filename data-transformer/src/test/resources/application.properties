# Override de src/main/resources/application.properties pour les tests
# (Maven place target/test-classes avant target/classes sur le classpath, ce
# fichier "gagne" donc automatiquement quand on lance les tests).
#
# spring.datasource.* n'est plus fixe ici : TestcontainersConfiguration
# demarre un vrai Postgres jetable et reconfigure la connexion via
# @ServiceConnection.

spring.profiles.active=test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

app.storage.dir=${java.io.tmpdir}/data-transformer-test-storage

app.preview.max-file-size=1048576
app.preview.max-records=200
